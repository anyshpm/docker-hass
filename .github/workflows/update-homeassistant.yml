name: Update Home Assistant Version

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if version is the same'
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: anyshpm/home-assistant

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
      id-token: write

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📋 Get versions
        id: versions
        run: |
          CURRENT=$(grep -oP 'FROM homeassistant/home-assistant:\K[^\s]+' Dockerfile)
          LATEST=$(curl -s "https://registry.hub.docker.com/v2/repositories/homeassistant/home-assistant/tags?page_size=100&ordering=last_updated" | \
            jq -r '.results[] | select(.name | test("^[0-9]{4}\\.[0-9]+\\.[0-9]+$")) | .name' | \
            sort -V | tail -1)
          
          # Validate versions
          [[ -z "$CURRENT" || -z "$LATEST" || "$LATEST" == "null" ]] && exit 1
          
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT, Latest: $LATEST"

      - name: 🔄 Check if update needed
        id: compare
        run: |
          CURRENT="${{ steps.versions.outputs.current }}"
          LATEST="${{ steps.versions.outputs.latest }}"
          
          if [ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "✅ Update needed: $CURRENT -> $LATEST"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Already up to date: $CURRENT"
          fi

      - name: 🛠️ Update files
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          CURRENT="${{ steps.versions.outputs.current }}"
          LATEST="${{ steps.versions.outputs.latest }}"
          
          # Update Dockerfile
          sed -i "s/FROM homeassistant\/home-assistant:$CURRENT/FROM homeassistant\/home-assistant:$LATEST/g" Dockerfile
          
          # Update README badges
          sed -i "s/Home%20Assistant-[0-9]\{4\}\.[0-9]\+\.[0-9]\+-blue/Home%20Assistant-${LATEST}-blue/g" README.md
          
          echo "✅ Files updated: $CURRENT -> $LATEST"

      - name: 🧪 Test build
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          docker build --no-cache -t test-build .
          docker run --rm -d --name test-container test-build || true
          sleep 10
          
          if docker ps -a --filter "name=test-container" --format "{{.Status}}" | grep -qE "(Exited \(0\)|Up)"; then
            echo "✅ Build and smoke test passed"
          else
            echo "❌ Test failed"
            docker logs test-container 2>/dev/null || true
            exit 1
          fi
          
          docker rm -f test-container 2>/dev/null || true

      - name: 🚀 Create branch and commit
        if: steps.compare.outputs.needs_update == 'true'
        id: commit
        run: |
          LATEST="${{ steps.versions.outputs.latest }}"
          BRANCH="update-homeassistant-${LATEST}"
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b "$BRANCH"
          git add Dockerfile README.md
          
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Update Home Assistant to $LATEST"
            git push origin "$BRANCH"
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "✅ Changes committed and pushed"
          else
            echo "❌ No changes to commit"
            exit 1
          fi

      - name: 📋 Create and Auto-Merge Pull Request
        if: steps.compare.outputs.needs_update == 'true' && steps.commit.outputs.branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.versions.outputs.current }}';
            const latest = '${{ steps.versions.outputs.latest }}';
            const branch = '${{ steps.commit.outputs.branch }}';
            
            const title = `🔄 Update Home Assistant to ${latest}`;
            const body = `## 📋 Summary
            - **Previous**: \`${current}\`
            - **New**: \`${latest}\`
            - **Date**: ${new Date().toUTCString()}
            
            ## 🧪 Tests Passed
            - ✅ Docker build successful
            - ✅ Container smoke test passed
            
            ## 📚 Release Notes
            https://github.com/home-assistant/core/releases/tag/${latest}
            
            > 🤖 Auto-tested and auto-merged by Update Workflow.`;
            
            const bases = ['master', 'main'];
            let createdPr = null;
            let targetBase = '';
            for (const base of bases) {
              try {
                const { data: pr } = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title, head: branch, base, body
                });
                createdPr = pr;
                targetBase = base;
                
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['automated-update', 'homeassistant-version']
                });
                
                console.log(`✅ Created PR #${pr.number}: ${pr.html_url}`);
                break;
              } catch (error) {
                if (base === bases[bases.length - 1]) throw error;
              }
            }
            
            if (!createdPr) {
              throw new Error('Failed to create PR against master/main');
            }
            
            core.setOutput('pr_number', createdPr.number);
            core.setOutput('pr_url', createdPr.html_url);
            core.setOutput('base_branch', targetBase);
            
            console.log(`🔀 Auto-merging PR #${createdPr.number}...`);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: createdPr.number,
              merge_method: 'merge',
              commit_title: `Merge pull request #${createdPr.number} from ${context.repo.owner}/${branch}`,
              commit_message: `Update Home Assistant to ${latest}`
            });
            console.log(`✅ PR #${createdPr.number} merged successfully`);
            
            // Clean up remote feature branch
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              console.log(`🧹 Deleted branch ${branch}`);
            } catch (err) {
              console.warn(`Could not delete branch ${branch}: ${err.message}`);
            }

      - name: 🏷️ Create Release Tag
        if: steps.compare.outputs.needs_update == 'true' && steps.pr.outputs.base_branch
        id: tag
        run: |
          LATEST="${{ steps.versions.outputs.latest }}"
          BASE="${{ steps.pr.outputs.base_branch }}"
          
          git fetch origin "$BASE"
          git checkout "$BASE"
          git pull origin "$BASE"
          
          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            echo "Tag $LATEST already exists locally"
          else
            git tag "$LATEST"
            git push origin "$LATEST"
            echo "✅ Created and pushed tag: $LATEST"
          fi
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: 📦 Create GitHub Release
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.versions.outputs.latest }}';
            try {
              const { data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: latest,
                name: `Home Assistant ${latest}`,
                body: `## 🏠 Home Assistant ${latest} with Telegram Proxy Patch\n\n- Automated update and release.\n- Docker image available on Docker Hub as \`anyshpm/home-assistant:${latest}\` and \`latest\`.\n\n### 📚 Official Release Notes\nhttps://github.com/home-assistant/core/releases/tag/${latest}`,
                draft: false,
                prerelease: false
              });
              console.log(`✅ GitHub Release created: ${release.html_url}`);
            } catch (error) {
              console.log(`Notice on creating release: ${error.message}`);
            }

      - name: 🔀 Set up QEMU
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        uses: docker/setup-qemu-action@v3

      - name: 🔐 Install cosign
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        uses: sigstore/cosign-installer@v3.4.0
        with:
          cosign-release: 'v2.2.3'

      - name: 🔑 Log into Docker Hub
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.latest }}

      - name: 🚀 Build and push multi-arch Docker image
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✍️ Sign the published Docker image
        if: steps.compare.outputs.needs_update == 'true' && steps.tag.outputs.tag
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}

      - name: 📧 Send Email Notification
        if: steps.compare.outputs.needs_update == 'true' && steps.build-and-push.outputs.digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🎉 Home Assistant ${{ steps.versions.outputs.latest }} Release Completed"
          body: |
            Hello,

            The automated update and release workflow for Home Assistant version ${{ steps.versions.outputs.latest }} has completed successfully with zero manual intervention required.

            📋 Release Summary:
            - Previous version: ${{ steps.versions.outputs.current }}
            - New version: ${{ steps.versions.outputs.latest }}
            - PR: ${{ steps.pr.outputs.pr_url }} (Auto-merged)
            - Git Tag: ${{ steps.versions.outputs.latest }}
            - Docker Image: ${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.latest }} & latest
            - Platforms: linux/amd64, linux/arm64
            - Image Digest: ${{ steps.build-and-push.outputs.digest }}
            - Cosign Signature: Verified and signed

            📚 Upstream Release Notes:
            https://github.com/home-assistant/core/releases/tag/${{ steps.versions.outputs.latest }}

            Repository: https://github.com/${{ github.repository }}

            This is an automated notification from the Home Assistant Docker update workflow.
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions <${{ secrets.EMAIL_FROM }}>

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🔄 Automated Update & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status / Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Version | \`${{ steps.versions.outputs.current }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest Version | \`${{ steps.versions.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Needs Update | \`${{ steps.compare.outputs.needs_update }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compare.outputs.needs_update }}" = "true" ]; then
            echo "| Smoke Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Pull Request | ✅ Auto-Merged ([#${{ steps.pr.outputs.pr_number }}](${{ steps.pr.outputs.pr_url }})) |" >> $GITHUB_STEP_SUMMARY
            echo "| Git Tag | ✅ \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Multi-arch Image | ✅ \`${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Image Digest | \`${{ steps.build-and-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Cosign Signature | ✅ Signed |" >> $GITHUB_STEP_SUMMARY
            echo "| Summary Email | ✅ Sent |" >> $GITHUB_STEP_SUMMARY
          fi
